<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 200: '#b9dffe',
              300: '#7cc8fd', 400: '#36adf9', 500: '#0c93ea',
              600: '#0074c8', 700: '#015ca3', 800: '#064f86',
              900: '#0b426f', 950: '#072a4a'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 font-sans text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Initial loading screen -->
  <div id="loading-screen" class="fixed inset-0 bg-gray-50 dark:bg-gray-950 flex items-center justify-center z-50">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-brand-600 dark:text-brand-400 mb-4">QuickNotes</h1>
      <div class="w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin mx-auto"></div>
    </div>
  </div>

  <!-- Main app shell (hidden until auth confirmed) -->
  <div id="app-shell" class="hidden h-screen flex flex-col">

    <!-- Top header bar -->
    <header class="h-14 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 shrink-0 z-30">
      <!-- Left: hamburger (mobile) + logo -->
      <div class="flex items-center gap-3">
        <button id="sidebar-toggle" class="lg:hidden p-2 -ml-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle sidebar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-xl font-bold text-brand-600 dark:text-brand-400 tracking-tight">
          Quick<span class="text-gray-800 dark:text-gray-200">Notes</span>
        </h1>
      </div>

      <!-- Center: search bar -->
      <div class="hidden sm:flex flex-1 max-w-md mx-4">
        <div class="relative w-full">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="search-input" type="text" placeholder="Search notes..."
            class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
        </div>
      </div>

      <!-- Right: profile -->
      <div class="relative">
        <button id="profile-btn" class="flex items-center gap-2 p-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Profile menu">
          <img id="profile-avatar" src="" alt="" class="w-8 h-8 rounded-full object-cover bg-brand-100 dark:bg-brand-900" />
          <span id="profile-name" class="hidden md:block text-sm font-medium max-w-[120px] truncate"></span>
          <svg class="w-4 h-4 text-gray-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <!-- Profile dropdown -->
        <div id="profile-dropdown" class="hidden absolute right-0 top-full mt-2 w-72 bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 overflow-hidden z-50">
          <div class="p-4 border-b border-gray-100 dark:border-gray-800">
            <div class="flex items-center gap-3">
              <img id="dropdown-avatar" src="" alt="" class="w-12 h-12 rounded-full object-cover bg-brand-100 dark:bg-brand-900" />
              <div class="min-w-0">
                <p id="dropdown-name" class="font-medium truncate"></p>
                <p id="dropdown-email" class="text-sm text-gray-500 dark:text-gray-400 truncate"></p>
              </div>
            </div>
          </div>
          <div class="p-2">
            <button id="signout-btn" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm text-red-600 dark:text-red-400 rounded-xl hover:bg-red-50 dark:hover:bg-red-950/50 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Body: sidebar + main content -->
    <div class="flex flex-1 overflow-hidden">

      <!-- Sidebar overlay (mobile) -->
      <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col lg:shrink-0">
        <!-- Mobile close -->
        <div class="lg:hidden flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800">
          <h2 class="font-bold text-brand-600 dark:text-brand-400">Quick<span class="text-gray-800 dark:text-gray-200">Notes</span></h2>
          <button id="sidebar-close" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800" aria-label="Close sidebar">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Mobile search -->
        <div class="sm:hidden p-3 border-b border-gray-100 dark:border-gray-800">
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input id="mobile-search-input" type="text" placeholder="Search notes..."
              class="w-full pl-10 pr-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" />
          </div>
        </div>

        <!-- New Note button -->
        <div class="p-3">
          <button id="new-note-btn" class="w-full flex items-center justify-center gap-2 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl transition-colors duration-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            New Note
          </button>
        </div>

        <!-- Nav sections -->
        <nav class="flex-1 overflow-y-auto px-3 pb-3">
          <div class="space-y-1">
            <button data-filter="all" class="sidebar-nav-item active w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
              All Notes
              <span id="count-all" class="ml-auto text-xs text-gray-400 tabular-nums"></span>
            </button>
            <button data-filter="pinned" class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
              Pinned
              <span id="count-pinned" class="ml-auto text-xs text-gray-400 tabular-nums"></span>
            </button>
            <button data-filter="archived" class="sidebar-nav-item w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
              Archived
              <span id="count-archived" class="ml-auto text-xs text-gray-400 tabular-nums"></span>
            </button>
          </div>

          <!-- Tags -->
          <div class="mt-6">
            <h3 class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Tags</h3>
            <div id="tags-list" class="space-y-1">
              <!-- Tags rendered dynamically -->
            </div>
            <p id="no-tags" class="px-3 text-xs text-gray-400 hidden">No tags yet</p>
          </div>
        </nav>

        <!-- Sidebar footer -->
        <div class="p-3 border-t border-gray-100 dark:border-gray-800">
          <button id="theme-toggle" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-600 dark:text-gray-400">
            <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <span class="block dark:hidden">Dark Mode</span>
            <span class="hidden dark:block">Light Mode</span>
          </button>
        </div>
      </aside>

      <!-- Main content area -->
      <main class="flex-1 flex overflow-hidden">

        <!-- Notes list panel -->
        <div id="notes-list-panel" class="w-full md:w-80 lg:w-96 border-r border-gray-200 dark:border-gray-800 flex flex-col shrink-0 bg-gray-50 dark:bg-gray-950">
          <!-- Panel header -->
          <div class="p-4 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
            <h2 id="panel-title" class="text-lg font-semibold">All Notes</h2>
            <p id="panel-count" class="text-sm text-gray-500 dark:text-gray-400 mt-0.5"></p>
          </div>

          <!-- Notes list -->
          <div id="notes-list" class="flex-1 overflow-y-auto p-3 space-y-2">
            <!-- Notes rendered dynamically -->
          </div>

          <!-- Loading state -->
          <div id="notes-loading" class="hidden flex-1 flex items-center justify-center p-8">
            <div class="text-center">
              <div class="w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin mx-auto mb-3"></div>
              <p class="text-sm text-gray-500">Loading your notes...</p>
            </div>
          </div>

          <!-- Empty state -->
          <div id="notes-empty" class="hidden flex-1 flex items-center justify-center p-8">
            <div class="text-center max-w-xs">
              <div class="w-16 h-16 bg-brand-50 dark:bg-brand-950 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </div>
              <h3 id="empty-title" class="font-semibold text-gray-800 dark:text-gray-200 mb-1">Your canvas is empty</h3>
              <p id="empty-message" class="text-sm text-gray-500 dark:text-gray-400 mb-4">Create your first note and start capturing your ideas.</p>
              <button id="empty-new-note-btn" class="inline-flex items-center gap-2 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-xl transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Create Note
              </button>
            </div>
          </div>
        </div>

        <!-- Note editor panel -->
        <div id="note-editor-panel" class="hidden md:flex flex-1 flex-col bg-white dark:bg-gray-950">
          <!-- No note selected state -->
          <div id="editor-empty" class="flex-1 flex items-center justify-center">
            <div class="text-center max-w-xs">
              <div class="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
              </div>
              <h3 class="font-semibold text-gray-600 dark:text-gray-400 mb-1">Select a note</h3>
              <p class="text-sm text-gray-400">Choose a note from the list or create a new one</p>
            </div>
          </div>

          <!-- Active editor -->
          <div id="editor-active" class="hidden flex-1 flex flex-col">
            <!-- Editor toolbar -->
            <div class="flex items-center justify-between px-6 py-3 border-b border-gray-100 dark:border-gray-800">
              <button id="editor-back" class="md:hidden flex items-center gap-1 text-sm text-brand-600 dark:text-brand-400 hover:text-brand-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Back
              </button>
              <div class="flex items-center gap-1">
                <button id="btn-pin" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-400 hover:text-brand-600" title="Pin note">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                </button>
                <button id="btn-archive" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-400 hover:text-yellow-600" title="Archive note">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                </button>
                <button id="btn-delete" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-400 hover:text-red-600" title="Delete note">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
              <div id="save-status" class="text-xs text-gray-400">
                <!-- Saved / Saving... / Unsaved -->
              </div>
            </div>

            <!-- Editor body -->
            <div class="flex-1 overflow-y-auto px-6 py-6 md:px-12 lg:px-20">
              <input id="note-title" type="text" placeholder="Untitled Note"
                class="w-full text-2xl md:text-3xl font-bold bg-transparent border-none outline-none placeholder-gray-300 dark:placeholder-gray-600 mb-4" />
              <textarea id="note-content" placeholder="Start writing..."
                class="w-full flex-1 text-base leading-relaxed bg-transparent border-none outline-none placeholder-gray-300 dark:placeholder-gray-600 resize-none min-h-[200px]"></textarea>

              <!-- Tags area -->
              <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-800">
                <div class="flex items-center gap-2 flex-wrap">
                  <div id="note-tags" class="flex items-center gap-2 flex-wrap">
                    <!-- Tags rendered here -->
                  </div>
                  <div class="relative">
                    <input id="tag-input" type="text" placeholder="Add tag..."
                      class="w-24 text-sm bg-transparent border-none outline-none placeholder-gray-400 focus:w-32 transition-all" />
                  </div>
                </div>
              </div>

              <!-- Metadata -->
              <div class="mt-4 text-xs text-gray-400">
                <span id="note-updated"></span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-xl max-w-sm w-full p-6 border border-gray-200 dark:border-gray-800">
      <h3 class="text-lg font-semibold mb-2">Delete this note?</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">This action cannot be undone.</p>
      <div class="flex justify-end gap-3">
        <button id="delete-cancel" class="px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Cancel</button>
        <button id="delete-confirm" class="px-4 py-2.5 text-sm font-medium rounded-xl bg-red-600 hover:bg-red-700 text-white transition-colors">Delete</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/firestore.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
