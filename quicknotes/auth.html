<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#f0f7ff', 100: '#e0effe', 200: '#b9dffe',
              300: '#7cc8fd', 400: '#36adf9', 500: '#0c93ea',
              600: '#0074c8', 700: '#015ca3', 800: '#064f86',
              900: '#0b426f', 950: '#072a4a'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 font-sans text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Initial loading screen — shown while Firebase checks if user is already signed in -->
  <div id="loading-screen" class="fixed inset-0 bg-gray-50 dark:bg-gray-950 flex items-center justify-center z-50">
    <div class="text-center">
      <h1 class="text-3xl font-bold text-brand-600 dark:text-brand-400 mb-4">QuickNotes</h1>
      <div class="w-8 h-8 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin mx-auto"></div>
    </div>
  </div>

  <!-- Auth container -->
  <div id="auth-container" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-brand-600 dark:text-brand-400 tracking-tight">
          Quick<span class="text-gray-800 dark:text-gray-200">Notes</span>
        </h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm">Your calm digital notebook</p>
      </div>

      <!-- Auth card -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-800 p-8">

        <!-- Tab switcher: Sign In / Create Account -->
        <div class="flex mb-6 bg-gray-100 dark:bg-gray-800 rounded-xl p-1">
          <button id="tab-signin" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-200 bg-white dark:bg-gray-700 text-gray-900 dark:text-white shadow-sm" onclick="switchTab('signin')">
            Sign In
          </button>
          <button id="tab-signup" class="flex-1 py-2.5 text-sm font-medium rounded-lg transition-all duration-200 text-gray-500 dark:text-gray-400" onclick="switchTab('signup')">
            Create Account
          </button>
        </div>

        <!-- Error / success messages -->
        <div id="auth-message" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

        <!-- Sign In form -->
        <form id="signin-form" class="space-y-4" onsubmit="return false;">
          <div>
            <label for="signin-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
            <input id="signin-email" type="email" required autocomplete="email"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="you@example.com" />
          </div>
          <div>
            <label for="signin-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
            <input id="signin-password" type="password" required autocomplete="current-password"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="••••••••" />
          </div>
          <button id="signin-btn" type="submit"
            class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
            Sign In
          </button>
        </form>

        <!-- Sign Up form (hidden by default) -->
        <form id="signup-form" class="space-y-4 hidden" onsubmit="return false;">
          <div>
            <label for="signup-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Full Name</label>
            <input id="signup-name" type="text" required autocomplete="name"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="Your Name" />
          </div>
          <div>
            <label for="signup-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Email</label>
            <input id="signup-email" type="email" required autocomplete="email"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="you@example.com" />
          </div>
          <div>
            <label for="signup-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
            <input id="signup-password" type="password" required autocomplete="new-password" minlength="6"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition" placeholder="At least 6 characters" />
          </div>
          <button id="signup-btn" type="submit"
            class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
            Create Account
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center my-6">
          <div class="flex-1 border-t border-gray-200 dark:border-gray-700"></div>
          <span class="px-4 text-sm text-gray-400">or</span>
          <div class="flex-1 border-t border-gray-200 dark:border-gray-700"></div>
        </div>

        <!-- Google sign in -->
        <button id="google-btn"
          class="w-full py-3 border border-gray-300 dark:border-gray-700 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Continue with Google</span>
        </button>
      </div>

      <!-- Theme toggle -->
      <div class="flex justify-center mt-6">
        <button id="auth-theme-toggle" class="p-2 rounded-xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle theme">
          <!-- Sun icon (shown in dark mode) -->
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <!-- Moon icon (shown in light mode) -->
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
